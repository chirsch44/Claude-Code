<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseball Image Generator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>⚾ Baseball Generator</h1>
      <p>Click the button to see a different baseball!</p>
    </header>

    <main>
      <div class="image-container">
        <img id="baseball-image" src="" alt="Baseball image will appear here">
      </div>

      <button id="generate-btn" class="btn-generate">
        Generate Baseball
      </button>
    </main>

    <footer>
      <p>Click the button as many times as you'd like!</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
